id: be-kind
title: Be kind
strictness: standard
sections:
  - title: KINDNESS
    rules:
      - Be polite. No insults, name-calling, slurs, or pile-ons.
      - Disagree with the point, not the person.
      - Don't mock a typo, a question, or someone who is new.
      - If a reply would embarrass someone, don't send it. Show it to me first.
